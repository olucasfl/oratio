<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8" />

<!--
 Zoom travado de propósito (decisão do produto): o app é de leitura/oração
 com muito scroll e o zoom acidental atrapalhava. Para ampliar texto há os
 controles internos (Perfil > tamanho da letra, e o painel da Bíblia).
 Zoom que "volta ao soltar o dedo" não existe como recurso de navegador.
 Obs.: o Safari fora do PWA instalado ignora user-scalable=no desde o iOS 10.
 O zoom acidental por toque-duplo é evitado via touch-action:manipulation
 (global.css) e o zoom-ao-focar do iOS, garantindo campos com fonte >= 16px.
 interactive-widget=resizes-content: encolhe o layout viewport com o teclado
 aberto (melhora o composer do Vox).
-->
<meta
 name="viewport"
 content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
/>

<title>Oratio</title>

<meta name="description" content="Oratio - Aplicativo de espiritualidade católica." />

<meta name="theme-color" content="#7B1113">
<meta name="color-scheme" content="light">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<!--
 "default" (não "black-translucent"): a status bar do iOS volta a ser uma
 faixa própria do sistema, com a hora/bateria sempre legível no tema claro.
 O webview passa a começar ABAIXO dela, então env(safe-area-inset-top) fica
 ~0 em standalone e o padding-top das telas para de precisar somá-lo.
-->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Oratio">

<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">

<!-- PWA -->

<link rel="manifest" href="/manifest.json">

<!-- FONTS PERFORMANCE -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">

<meta property="og:title" content="Oratio - Espiritualidade Católica">
<meta property="og:description" content="Aplicativo de espiritualidade católica com liturgia diária, orações e inteligência artificial.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://oratio-phi.vercel.app/">
<meta property="og:image" content="/icon-512.png">

<link
 href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap"
 rel="stylesheet"
>

<!-- ÍCONES IOS -->

<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">

<!-- FAVICON -->

<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<link rel="shortcut icon" href="/icon-192.png">

</head>

<body>

<div id="root"></div>

<!--
 Alvo dos overlays fixos (navbar, composer do Vox, modais, sheets,
 drawers). Fica FORA do #root de propósito: nada de transform/zoom/
 backdrop-filter de um ancestral pode transformá-lo em containing block
 e "prender" um position:fixed. Ver src/components/Portal/Portal.tsx.
-->
<div id="overlay-root"></div>

<noscript>
 Este aplicativo requer JavaScript para funcionar.
</noscript>

<script type="module" src="/src/main.tsx"></script>

</body>

</html>
